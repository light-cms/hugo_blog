<!doctype html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ .Description | default .Site.Params.description }}" />
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}" />
  {{ range .AlternativeOutputFormats -}}
  {{ printf `<link rel="%s" type="%s" href="%s" />` .Rel .MediaType.Type .Permalink | safeHTML }}
  {{ end -}}
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="brand" href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
      <span class="links">
        <a href="{{ "/" | relURL }}" {{ if .IsHome }}aria-current="page"{{ end }}>Home</a>
        <a href="{{ "posts/" | relURL }}" {{ if or (eq .Section "posts") (eq .RelPermalink "/posts/") }}aria-current="page"{{ end }}>Posts</a>
        <a href="{{ "about/" | relURL }}" {{ if eq .RelPermalink "/about/" }}aria-current="page"{{ end }}>About</a>
      </span>
    </nav>
  </header>

  <main class="container">
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <p>Built with <a href="https://gohugo.io/">Hugo</a>. Edit <code>content/</code> and <code>layouts/</code> to make it yours.</p>
  </footer>
</body>
</html>
